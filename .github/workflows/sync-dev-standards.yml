name: Sync Development Standards

on:
  workflow_dispatch:
  push:
    paths:
      - '.dev-standards/config.yml'
  schedule:
    # 매일 09:05 KST = 00:05 UT
    - cron: "5 0 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-guide:
    uses: ydj515/ci-workflows/.github/workflows/sync-dev-standards.yml@v1.3.0
    with:
      standards_owner: ydj515
      standards_repo: dev-standards
      standards_ref: v1.3.0
      delivery_mode: pull-request
      sync_gemini: true
      bootstrap_agent_files: true
